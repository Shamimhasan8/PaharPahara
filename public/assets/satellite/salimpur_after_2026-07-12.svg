<?xml version="1.0" encoding="UTF-8"?>
<!-- PaharPahara placeholder Sentinel-2 SR chip — Jangal Salimpur AFTER (seasonal candidate).
     Same hill with a small subtle yellowing patch (not cutting). Stylized SVG, NOT real imagery.
     Palette: forest oklch(0.45 0.10 150)->oklch(0.65 0.12 140), bare oklch(0.55 0.13 35), text oklch(0.20 0 0). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t4 d4">
